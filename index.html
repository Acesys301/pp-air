<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B11F2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pp air">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Pp air</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{--red:#B11F2B;--red2:#8E1822;--gold:#A3802F;--gold2:#E2C276;--in:#1E9E5A;--out:#E07A1F;--bg:#F6F3EE;--card:#fff;--ink:#1E1A17;--mute:#756C63;--line:#E8E1D8;--bad:#C83A3A;--ok:#1E9E5A}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Lao","Lao Sangam MN","Phetsarath OT",sans-serif}
  button{font:inherit;cursor:pointer}
  .top{background:var(--red);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px solid var(--gold)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:19px;white-space:nowrap}
  .brand img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.brand b{color:var(--gold2)}
  .top .tools{display:flex;gap:6px}
  .top button{background:transparent;color:#fde8ea;border:1px solid #d9666f;border-radius:8px;padding:6px 10px;font-size:13px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;background:var(--red);color:#fff;margin-top:16px}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid var(--line)}
  .btn.gold{background:var(--gold)}
  .btn:disabled{opacity:.5}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
  .okmsg{color:var(--ok);font-size:14px;margin-top:10px}
  .loginlogo{display:block;width:190px;max-width:62%;margin:6px auto 14px}
  .hello{font-size:14px;color:var(--mute)}.who{font-size:22px;font-weight:800}
  .clock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .date{color:var(--mute)}
  .punch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .punch button{border:0;border-radius:16px;padding:24px 10px;color:#fff;font-weight:800;font-size:21px}
  .punch .in{background:var(--in)}.punch .out{background:var(--out)}
  .punch small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:4px}
  .facecard{background:#FFF7E6;border:1px solid #EBD39C;border-radius:14px;padding:18px;text-align:center}
  .facecard .ico{font-size:44px}.facecard b{display:block;font-size:18px;margin-top:4px}.facecard p{margin:6px 0 0;font-size:14px;color:var(--mute)}
  .linkbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;text-align:left;color:var(--ink)}
  .linkbtn b{display:block}.linkbtn span{font-size:13px;color:var(--mute)}.linkbtn i{font-style:normal;font-size:20px;color:var(--mute)}
  .linkbtn.sup{background:#FFF7E6;border-color:#EBD39C}
  .badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;text-align:center;margin-left:6px}
  .last{margin-top:12px;font-size:14px;color:var(--mute);text-align:center}
  h3{margin:0 0 10px;font-size:15px}
  .hist{list-style:none;margin:0;padding:0}
  .hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .hist li:last-child{border-bottom:0}
  .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap}
  .tag.IN{background:var(--in)}.tag.OUT{background:var(--out)}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .pill.PENDING{background:#FFF1CC;color:#8a6400}.pill.APPROVED,.pill.OK{background:#DDF3E6;color:#11693b}.pill.REJECTED,.pill.FLAG{background:#FBE0E0;color:#a12a2a}
  .pill.MANUAL{background:#EFE9E1;color:#5a4f45}.pill.FACE{background:#E6F0FB;color:#1d4f86}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg.v{grid-template-columns:1fr}
  .seg label{margin:0}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
  .seg input:checked+span{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  /* camera overlay */
  .ov{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;z-index:10}
  .ov.on{display:flex}
  .ov header{padding:16px;padding-top:calc(16px + env(safe-area-inset-top));text-align:center}
  .ov header .step{font-size:12px;opacity:.7;letter-spacing:1px}
  .ov header .msg{font-size:20px;font-weight:700;margin-top:4px}
  .stage{flex:1;position:relative;overflow:hidden}
  .stage video{width:100%;height:100%;object-fit:cover}
  .stage video.mirror{transform:scaleX(-1)}
  .frame{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .2s}
  .frame.face{border-radius:50%;width:62vmin;height:78vmin}
  .frame.good{border-color:#3ddc84}
  .prog{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:60%;height:8px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden;display:none}
  .prog i{display:block;height:100%;width:0;background:#3ddc84;transition:width .2s}
  .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;text-shadow:0 2px 12px #000}
  .ov footer{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .ov footer button{width:100%;background:#333;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px}
  .result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .result .big{font-size:64px}.result .t{font-size:26px;font-weight:800;margin-top:8px}.result .s{opacity:.8;margin-top:6px}
  /* kiosk */
  .kiosk{min-height:100vh;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
  .kiosk .klogo{height:min(14vh,120px);background:#fff;border-radius:50%;padding:8px}
  .kiosk .qr{background:#fff;padding:16px;border-radius:20px;margin:14px 0;border:4px solid var(--gold)}
  .kiosk .qr svg{display:block;width:min(56vh,80vw);height:min(56vh,80vw)}
  .kiosk .k1{font-size:clamp(20px,3.4vw,36px);font-weight:800;line-height:1.25}
  .kiosk .k1 small{display:block;font-size:.72em;font-weight:600;color:var(--gold2)}
  .kiosk .k2{opacity:.85;font-size:clamp(13px,1.8vw,18px)}
  /* review / admin */
  .wide{max-width:1100px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .row>div{flex:1;min-width:140px}
  .row .btn{margin-top:0;width:auto;padding:12px 18px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--mute)}
  .scan{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .scan:last-child{border-bottom:0}
  .scan.FLAG{background:#FDF1F1;margin:0 -10px;padding:10px}
  .scan .info{flex:1;min-width:0}
  .scan .info b{font-size:15px}.scan .info div{font-size:13px;color:var(--mute)}
  .thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#eee8e0;display:block;cursor:pointer;flex:none}
  .thumb.none{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mute);cursor:default;text-align:center}
  .pair{display:flex;gap:6px;flex:none}
  .pair figure{margin:0;text-align:center}
  .pair figcaption{font-size:10px;color:var(--mute);margin-top:2px}
  .acts{display:flex;gap:6px;flex:none}
  .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
  .acts .y{color:var(--ok)}.acts .n{color:var(--bad)}
  .acts .y.on{background:var(--ok);color:#fff;border-color:var(--ok)}.acts .n.on{background:var(--bad);color:#fff;border-color:var(--bad)}
  .req{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .req .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .req .d{font-size:14px;color:var(--mute);margin-top:4px}
  .req .acts{margin-top:10px}.req .acts button{flex:1;padding:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#FDF3E1;border:1px solid #F2D8A7;border-radius:20px;padding:5px 12px;font-size:14px;color:var(--ink)}
  button.chip{cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:8px;border-bottom:1px solid var(--line)}
  .big-img{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20}
  .big-img.on{display:flex}.big-img img{max-width:92vw;max-height:88vh;border-radius:12px}
  .muted{color:var(--mute);font-size:13px}
  /* leave */
  .lt-AL{--c:#2F80ED}.lt-SL{--c:#E0457B}.lt-UL{--c:#7A8494}.lt-PH{--c:#F2994A}.lt-OFF{--c:#9B51E0}
  .ltag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;background:var(--c,#888);white-space:nowrap}
  .lvcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .lvh{font-size:11px;color:var(--mute);text-align:center}
  .lvd{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:56px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:12px;color:var(--ink);text-align:left}
  .lvd.pk{min-height:42px;align-items:center;justify-content:center;font-size:15px;cursor:pointer}.lvd.pk.sel{background:var(--red);color:#fff;outline:none}.lvd.pk:disabled{opacity:.3}
  .pkm{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.pkm button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:16px}
  .lvd.pk.has::after{content:'';width:5px;height:5px;border-radius:50%;background:#E0457B;display:block;margin-top:1px}
  .pkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pkchips span{background:#F4ECE2;border-radius:12px;padding:3px 10px;font-size:13px}
  .lvd.hol:not(.sel){background:#FDECEC;border-color:#F3B8B8;color:#C83A3A}
  .lvd.sel{outline:2px solid var(--red)}.lvd.now{background:#FFF7E6}.lvd.empty{visibility:hidden}
  .lvbars{display:flex;flex-wrap:wrap;gap:2px}
  .lb{display:block;width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
  .lb.pend{background:#fff}
  button.chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chip .cd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
  .lvmonth{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .lvmonth button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:16px}
  .lvgrp{margin-top:14px}.lvgrp h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
  .lvitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .lvitem .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lvitem .d{font-size:13px;color:var(--mute);margin-top:3px}
  .lvitem .acts{margin-top:8px}.lvitem .acts button{flex:1;padding:9px}
  .certbtn{margin-top:10px;width:100%;border:1px dashed var(--red);background:#fff;color:var(--red);border-radius:10px;padding:11px;font-weight:600}
  .copy{display:flex;gap:8px}.copy input{font-size:13px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}.scan{flex-wrap:wrap}.scan .acts{width:100%}.scan .acts button{flex:1}}
  @media print{body{background:#fff!important}.kiosk{background:#fff!important}.kiosk,.kiosk *{color:#000!important}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>

    <div class="frame" id="frame"></div>
    <div class="prog" id="prog"><i></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="result" id="result" style="display:none"></div>
  <footer><button id="ovClose"></button></footer>
</div>
<div class="big-img" id="bigImg"><img alt=""></div>
<canvas id="cv" hidden></canvas>

};
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function today(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function addDays(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function fmtDay(d){
  const x = new Date(d + 'T00:00:00');
  return x.toLocaleDateString(LANG === 'lo' ? 'lo-LA' : 'en-GB', { weekday:'short', day:'numeric', month:'short' });
}

async function api(action, body = {}){
  if (API_URL.startsWith('PASTE')) throw new Error('App not set up yet: API_URL is missing in index.html.');
  let r;
  try{
    r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, ...body }) });
  }catch(e){ throw new Error(tErr('No internet connection. Please try again.')) }
  const j = await r.json().catch(() => ({ ok:false, error:'Server error. Please try again.' }));
  if (!j.ok) throw new Error(tErr(j.error || 'Something went wrong.'));
  return j;
}

function deviceId(){
  let d = store.get('ppair_device');
  if (!d){
    d = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
    store.set('ppair_device', d);
  }
  return d;
}

/* ======================= FACE CHECK (runs on the phone) ======================= */
let faceReady = null;
function loadFace(){
  if (!faceReady) faceReady = (async () => {
    if (!window.faceapi) await new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = FACE_CDN + 'dist/face-api.js';
      s.onload = res; s.onerror = () => rej(new Error(t('faceLoadErr'))); document.head.appendChild(s);
    });
    try{ await faceapi.tf.ready(); }catch(e){}
    const M = FACE_CDN + 'model/';
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M), faceapi.nets.faceLandmark68Net.loadFromUri(M), faceapi.nets.faceRecognitionNet.loadFromUri(M)]);
  })().catch(e => { faceReady = null; throw new Error(t('faceLoadErr')); });
  return faceReady;
}
/* Reads the face several times from the front camera; returns the average face code + one photo. */
async function readFace(stepLabel){
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  const got = []; let photo = '', misses = 0; const started = Date.now();
  const prog = $('#prog'); prog.style.display = 'block'; prog.firstElementChild.style.width = '0';
  try{
    while (got.length < FACE_SAMPLES){
      if (cancelled) throw new Error('cancelled');
      if (Date.now() - started > 40000) throw new Error(t('noFace'));
      const r = await faceapi.detectSingleFace(vid, opts).withFaceLandmarks().withFaceDescriptor();
      const fr = $('#frame');
      if (!r || r.detection.score < 0.6){ fr.classList.remove('good'); ov(stepLabel, t('faceLook')); if (++misses > 3) { got.length = 0; prog.firstElementChild.style.width = '0'; } await sleep(120); continue; }
      if (r.detection.box.width / vid.videoWidth < 0.22){ fr.classList.remove('good'); ov(stepLabel, t('faceCloser')); await sleep(120); continue; }
      misses = 0; fr.classList.add('good'); ov(stepLabel, t('faceHold'));
      got.push(Array.from(r.descriptor));
      if (got.length === 1) photo = snap();
      prog.firstElementChild.style.width = Math.round(got.length / FACE_SAMPLES * 100) + '%';
      await sleep(200);
    }
  } finally { prog.style.display = 'none'; }
  const face = got[0].map((_, i) => Math.round(got.reduce((s, g) => s + g[i], 0) / got.length * 100000) / 100000);
  return { face, photo };
}

/* ---------- camera flow: location -> scan QR -> face check -> send ---------- */
let stream = null, loop = null, cancelled = false;
const vid = $('#vid'), cv = $('#cv');

function stopCam(){
  cancelAnimationFrame(loop); loop = null;
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null; vid.srcObject = null;
}
async function openCam(facing){
  stopCam();
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  vid.srcObject = stream;
  vid.classList.toggle('mirror', facing === 'user');
  await vid.play().catch(() => {});
  await new Promise(r => vid.readyState >= 2 ? r() : (vid.onloadeddata = r));
}
function ov(step, msg){ $('#ovStep').textContent = step; $('#ovMsg').textContent = msg; }
function showStage(on){ $('#stage').style.display = on ? '' : 'none'; $('#result').style.display = on ? 'none' : 'flex'; }
function busy(icon, text){ showStage(false); $('#result').innerHTML = `<div class="big">${icon}</div><div class="t">${esc(text)}</div>`; }
function closeOv(){ cancelled = true; stopCam(); $('#ov').classList.remove('on'); }
$('#ovClose').onclick = closeOv;
function openOv(){
  cancelled = false;
  $('#ov').classList.add('on'); showStage(true); $('#count').textContent = ''; $('#ovClose').textContent = t('cancel');
  $('#frame').className = 'frame';
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

async function startEnroll(){
  if (!openOv()) return showResult(false, t('noCam'), t('noCamSub'));
  try{
    ov(t('faceStep'), ''); busy('⏳', t('faceLoading'));
    await loadFace();
    if (cancelled) return;
    showStage(true); $('#frame').className = 'frame face';
    await openCam('user');
    const { face, photo } = await readFace(t('faceStep'));
    stopCam();
    if (cancelled) return;
    busy('⏳', t('sending')); $('#ovClose').textContent = t('wait');
    await api('setFace', { ...staffCred(), face, photo });
    me.hasFace = true; saveMe();
    showResult(true, t('faceSaved'), t('faceSavedSub'));
    renderHome();
  }catch(e){ failFlow(e); }
}

async function startPunch(type){
  const word = t('w' + type);
  if (!openOv()) return showResult(false, t('noCam'), t('noCamSub'));
  try{
    ov(word, ''); busy('📍', t('gettingLoc'));
    const [pos] = await Promise.all([getLocation(), loadFace()]);
    if (cancelled) return;
    showStage(true); ov(t('step1') + ' · ' + word, t('scanQr'));
    await openCam('environment');
    const qr = await scanQR();
    if (cancelled) return;
    if (navigator.vibrate) navigator.vibrate(80);
    $('#frame').className = 'frame face'; ov(t('step2') + ' · ' + word, t('faceCheck'));
    await openCam('user');
    const { face, photo } = await readFace(t('step2') + ' · ' + word);
    stopCam();
    if (cancelled) return;
    busy('⏳', t('sending')); $('#ovClose').textContent = t('wait');
    const r = await api('punch', { ...staffCred(), type, qr, lat: pos.lat, lng: pos.lng, acc: pos.acc, face, photo });
    me.history = r.history; saveMe();
    showResult(true, `${word} ${r.time}`, `${r.date} · ${me.name} · ${t('match')} ${r.match}%`);
    renderHome();
  }catch(e){ failFlow(e); }
}
function failFlow(e){
  if (cancelled) return;
  stopCam();
  showResult(false, t('notSaved'), e && e.name === 'NotAllowedError' ? t('allowCam') : (e.message || String(e)));
}
function getLocation(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error(t('locOff')));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      e => reject(new Error(e.code === 1 ? t('locDenied') : t('locOff'))),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function showResult(ok, title, sub){
  showStage(false); ov('', '');
  $('#result').innerHTML = `<div class="big">${ok ? '✅' : '⚠️'}</div><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div>`;
  $('#ovClose').textContent = ok ? t('done') : t('close');
}
function scanQR(){
  return new Promise((resolve, reject) => {
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const started = Date.now();
    const step = () => {
      if (cancelled) return;
      if (Date.now() - started > 90000) return reject(new Error(t('noQr')));
      if (vid.videoWidth){
        const w = 480, h = Math.round(vid.videoHeight * w / vid.videoWidth);
        cv.width = w; cv.height = h; ctx.drawImage(vid, 0, 0, w, h);
        const code = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (code && code.data.startsWith(QR_PREFIX)) return resolve(code.data);
      }
      loop = requestAnimationFrame(step);
    };
    step();
  });
}
function snap(){
  const w = 360, h = Math.round(vid.videoHeight * w / vid.videoWidth);
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(vid, 0, 0, w, h);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, h - 22, w, 22);
  ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif';
  ctx.fillText(`${me.id} · ${new Date().toLocaleString('en-GB')}`, 6, h - 7);
  return cv.toDataURL('image/jpeg', 0.7);
}

const LAO_HOL = {

  '2027-01-01':['New Year\'s Day','ວັນປີໃໝ່ສາກົນ'],

  '2027-04-14':['Lao New Year (Pi Mai)','ບຸນປີໃໝ່ລາວ'], '2027-04-15':['Lao New Year (Pi Mai)','ບຸນປີໃໝ່ລາວ'], '2027-04-16':['Lao New Year (Pi Mai)','ບຸນປີໃໝ່ລາວ'],

  '2027-12-02':['Lao National Day','ວັນຊາດ ສປປ ລາວ']
};
const holList = month => Object.keys(LAO_HOL).filter(d => d.startsWith(month)).sort()
  .map(d => `<div style="color:#C83A3A">● ${esc(fmtDay(d))} – ${esc(LAO_HOL[d][LANG === 'lo' ? 1 : 0])}</div>`).join('');
const SICK_CERT_DAYS = 3;
function datesTxt(ds){
  ds = (ds || []).slice().sort(); const out = []; let i = 0;
  while (i < ds.length){ let j = i; while (j + 1 < ds.length && addDays(ds[j], 1) === ds[j + 1]) j++; out.push(j === i ? fmtDay(ds[i]) : fmtDay(ds[i]) + ' → ' + fmtDay(ds[j])); i = j + 1; }
  return out.join(', ');
}
const rangeTxt = l => (l.dates && l.dates.length) ? datesTxt(l.dates) : (l.from === l.to ? fmtDay(l.from) : fmtDay(l.from) + ' → ' + fmtDay(l.to));
function fileToJpeg(file, max = 1280){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read the photo.')); };
    im.src = url;
  });
}

}

  const m = location.hash.match(/#qr=([^&]+)/);
  if (m) { store.set('ppair_kiosk', decodeURIComponent(m[1])); history.replaceState(null, '', '#qr'); }
  const key = store.get('ppair_kiosk');
  document.body.style.background = 'var(--red)';
  app.innerHTML = `
    <div class="kiosk">
      <img class="klogo" src="${LOGO}" alt="Pp air">
      <div class="k1" style="margin-top:10px">${TXT.kiosk1[1]}<small>${TXT.kiosk1[0]}</small></div>
      <div class="qr" id="qrBox"><div style="width:min(56vh,80vw);height:min(56vh,80vw);display:flex;align-items:center;justify-content:center;color:#999">…</div></div>
      <button onclick="window.print()" class="noprint" style="margin-top:6px;padding:10px 22px;border:0;border-radius:10px;background:#fff;color:#B11F2B;font-weight:700;font-size:16px">Print</button>
      <div class="k2" style="margin-top:10px"><span id="kclock"></span> · ${TXT.kiosk2[1]} · ${TXT.kiosk2[0]}</div>
      <div class="k2" id="kerr" style="color:#ffd2d2;margin-top:8px"></div>
    </div>`;
  if (!key) { $('#kerr').textContent = 'Kiosk key missing. Open the QR link from the admin screen on this device.'; return; }
  let current = '';
  const draw = token => {
    const q = qrcode(0, 'M'); q.addData(token); q.make();
    $('#qrBox').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  };
  const poll = async () => {
    try{
      const r = await api('qr', { kiosk: key });
      $('#kerr').textContent = '';
      if (r.token !== current) { current = r.token; draw(current); }
      $('#kclock').textContent = r.now.slice(0, 5);
    }catch(e){ $('#kerr').textContent = e.message; }
  };
  poll(); setInterval(poll, 30000);
  const keepAwake = async () => { try{ await navigator.wakeLock?.request('screen') }catch(e){} };
  keepAwake(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());
}

route();
</script>
</body>
</html>
